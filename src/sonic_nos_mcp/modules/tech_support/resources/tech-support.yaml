  # SONiC Tech Support Analysis with MCP Tools

  ## Overview

  This guide demonstrates how to analyze SONiC tech support files using the MCP server's powerful tools instead of manual bash commands. The MCP server provides three main tools that replace traditional shell-based analysis:

  1. **`extract_tech_support_file`** - Automatically extracts archives and returns file listings
  2. **`list_tech_support_files_tool`** - Intelligent file discovery with glob patterns
  3. **`read_tech_support_file`** - Regex-based content extraction with chunking and pagination

  ## What are SONiC Tech Support Files

  SONiC tech support files are comprehensive diagnostic bundles (`.tar.gz` archives) that capture the complete state of a SONiC network device at a specific point in time. These files contain:

  * System configuration from all databases (CONFIG_DB, STATE_DB, ASIC_DB)
  * Operational state and health information
  * Hardware sensor readings and status data
  * Log files from all containers and services
  * Network state including routing and switching tables
  * Process and system resource utilization

  ## MCP Tool Workflow Patterns

  ### 1. Archive Extraction and Discovery

  **Start every analysis by extracting the archive:**

  ```
  extract_tech_support_file(file_path="path/to/techsupport.tar.gz")
  ```

  **Returns:**
  - `extract_dir`: Path to extracted files
  - `files`: Complete list of all files in the archive
  - `success`: Boolean indicating extraction success

  **Follow up with targeted file discovery:**

  ```
  # Find all JSON database files
  list_tech_support_files_tool(extract_dir="/tmp/extracted", pattern="*.json")

  # Find all files in dump directory
  list_tech_support_files_tool(extract_dir="/tmp/extracted", pattern="dump/*")

  # Find all log files
  list_tech_support_files_tool(extract_dir="/tmp/extracted", pattern="*log*")

  # Find network-related files
  list_tech_support_files_tool(extract_dir="/tmp/extracted", pattern="*interface*")
  ```

  ### 2. Database Analysis with Pattern Matching

  **CONFIG_DB Analysis (System Configuration):**

  ```
  # Get device metadata and platform information
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="DEVICE_METADATA.*localhost",
      page=1
  )

  # Find specific interface configurations
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="PORT.*Ethernet16|BREAKOUT_CFG.*Ethernet16",
      page=1
  )

  # Check VLAN configurations
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="VLAN.*|VLAN_MEMBER.*",
      page=1
  )

  # BGP neighbor configurations
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="BGP_NEIGHBOR.*",
      page=1
  )
  ```

  **STATE_DB Analysis (Operational State):**

  ```
  # System health overview
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="SYSTEM_HEALTH_INFO.*",
      page=1
  )

  # Interface operational status
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="PORT_TABLE.*Ethernet16",
      page=1
  )

  # Hardware component status
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="PSU_INFO.*|FAN_INFO.*|TEMPERATURE_INFO.*",
      page=1
  )

  # Service health status
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="ALL_SERVICE_STATUS.*",
      page=1
  )
  ```

  ### 3. Log Analysis with Compressed File Support

  **The MCP tools automatically handle compressed (.gz) files:**

  ```
  # Analyze critical SWSS state changes (handles .gz automatically)
  read_tech_support_file(
      file_path="log/swss.rec.gz",
      pattern="Ethernet16.*|STP.*|VLAN.*",
      page=1
  )

  # Check SAI hardware API calls
  read_tech_support_file(
      file_path="log/sairedis.rec.gz",
      pattern="PORT.*|DOWN.*|BLOCK.*",
      page=1
  )

  # System log analysis
  read_tech_support_file(
      file_path="log/syslog.gz",
      pattern="(?i)(error|critical|fail).*",
      page=1
  )

  # BGP daemon logs
  read_tech_support_file(
      file_path="log/bgpd.log.gz",
      pattern="(?i)(auth.*fail|password.*mismatch|inactive)",
      page=1
  )
  ```

  ### 4. System Information Files

  **Use simple reads for formatted status files:**

  ```
  # Interface status table
  read_tech_support_file(file_path="dump/interface.status", page=1)

  # SONiC version and platform info
  read_tech_support_file(file_path="dump/version", page=1)

  # Container status
  read_tech_support_file(file_path="dump/docker.ps", page=1)

  # Process information
  read_tech_support_file(file_path="dump/top", page=1)

  # Hardware sensor readings
  read_tech_support_file(file_path="dump/sensors", page=1)
  ```

  ## Troubleshooting Scenarios with MCP Tools

  ### Scenario 1: Interface Connectivity Issues

  **Systematic interface analysis workflow:**

  ```
  # Step 1: Extract the archive
  extract_tech_support_file(file_path="techsupport.tar.gz")

  # Step 2: Check interface administrative and operational status
  read_tech_support_file(
      file_path="dump/interface.status",
      pattern="Ethernet16",
      page=1
  )

  # Step 3: Verify intended configuration in CONFIG_DB
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="PORT.*Ethernet16.*|BREAKOUT_CFG.*Ethernet16",
      page=1
  )

  # Step 4: Check operational details in STATE_DB
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="PORT_TABLE.*Ethernet16",
      page=1
  )

  # Step 5: Examine error counters and statistics
  read_tech_support_file(
      file_path="dump/COUNTERS_DB.json",
      pattern="Ethernet16.*(error|drop|discard)",
      page=1
  )

  # Step 6: Review recent state changes in SWSS logs
  read_tech_support_file(
      file_path="log/swss.rec.gz",
      pattern="Ethernet16.*(UP|DOWN|BLOCK|LEARN|FORWARD)",
      page=1
  )
  ```

  ### Scenario 2: BGP Session Troubleshooting

  **BGP neighbor investigation workflow:**

  ```
  # Step 1: Extract the archive
  extract_tech_support_file(file_path="techsupport_bgp_md5.tar.gz")

  # Step 2: Check BGP neighbor status
  read_tech_support_file(
      file_path="dump/bgp.summary",
      pattern="10\.255\.0\.2.*",
      page=1
  )

  # Step 3: Examine BGP configuration for authentication
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="BGP_NEIGHBOR.*10\.255\.0\.2.*auth.*md5",
      page=1
  )

  # Step 4: Check BGP daemon logs for session issues
  read_tech_support_file(
      file_path="log/bgpd.log.gz",
      pattern="10\.255\.0\.2.*(password.*mismatch|auth.*fail|Inactive)",
      page=1
  )

  # Step 5: Look for relevant system log entries
  read_tech_support_file(
      file_path="log/syslog.gz",
      pattern="bgp.*10\.255\.0\.2.*(Connect|Active|auth)",
      page=1
  )
  ```

  ### Scenario 3: Hardware Health Assessment

  **Complete hardware health analysis:**

  ```
  # Step 1: Extract the archive
  extract_tech_support_file(file_path="techsupport.tar.gz")

  # Step 2: Check overall system health summary
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="SYSTEM_HEALTH_INFO.*",
      page=1
  )

  # Step 3: Examine individual hardware components
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="PSU_INFO.*|FAN_INFO.*|TEMPERATURE_INFO.*",
      page=1
  )

  # Step 4: Get current sensor readings
  read_tech_support_file(
      file_path="dump/sensors",
      page=1
  )

  # Step 5: Check for hardware alerts in system logs
  read_tech_support_file(
      file_path="log/syslog.gz",
      pattern="(?i)(hardware|psu|fan|temperature|thermal).*(error|fail|critical|alert)",
      page=1
  )
  ```

  ### Scenario 4: Container/Service Health Issues

  **Service and container analysis workflow:**

  ```
  # Step 1: Extract the archive
  extract_tech_support_file(file_path="techsupport_syncd_crash.tar.gz")

  # Step 2: Check container status and uptime
  read_tech_support_file(
      file_path="dump/docker.ps",
      pattern="syncd.*",
      page=1
  )

  # Step 3: Review service health status
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="ALL_SERVICE_STATUS.*syncd",
      page=1
  )

  # Step 4: Check for container crash/restart events
  read_tech_support_file(
      file_path="log/syslog.gz",
      pattern="syncd.*(exit|crash|kill|restart)",
      page=1
  )

  # Step 5: Examine container resource usage
  read_tech_support_file(
      file_path="dump/docker.stats",
      pattern="syncd.*",
      page=1
  )
  ```

  ### Scenario 5: Memory Exhaustion Analysis

  **System resource and memory pressure investigation:**

  ```
  # Step 1: Extract the archive
  extract_tech_support_file(file_path="techsupport_oom.tar.gz")

  # Step 2: Check reboot history for unusual patterns
  read_tech_support_file(
      file_path="dump/reboot.cause.history",
      pattern="Unknown.*15:5[2-9]|16:0[0-1]",
      page=1
  )

  # Step 3: Check OOM handling configuration
  read_tech_support_file(
      file_path="etc/sysctl.conf",
      pattern="vm\.panic_on_oom.*",
      page=1
  )

  # Step 4: Examine container resource usage
  read_tech_support_file(
      file_path="dump/docker.stats",
      pattern=".*",
      page=1
  )

  # Step 5: Check for memory pressure indicators
  read_tech_support_file(
      file_path="dump/free",
      page=1
  )

  # Step 6: Look for warm-start evidence after reboot
  read_tech_support_file(
      file_path="log/syslog.1.gz",
      pattern="(?i)(warm.*start|port.*init)",
      page=1
  )
  ```

  ## Advanced Pattern Matching Techniques

  ### Regex Pattern Examples for Common Searches

  **Interface-related patterns:**
  ```
  # Any interface with errors
  "Ethernet.*\d+.*(error|drop|discard)"

  # Specific interface state changes
  "Ethernet16.*(UP|DOWN|BLOCK|LEARN|FORWARD)"

  # Interface configuration entries
  "PORT.*Ethernet\d+|BREAKOUT_CFG.*Ethernet\d+"
  ```

  **BGP and routing patterns:**
  ```
  # BGP neighbor issues
  "BGP_NEIGHBOR.*\d+\.\d+\.\d+\.\d+.*(auth|md5|password)"

  # BGP session states
  "\d+\.\d+\.\d+\.\d+.*(Established|Active|Connect|Idle)"

  # Route table analysis
  "ROUTE_TABLE.*\d+\.\d+\.\d+\.\d+"
  ```

  **Hardware health patterns:**
  ```
  # Temperature and thermal issues
  "(?i)(temperature|thermal).*(critical|high|overheat)"

  # Power supply issues
  "PSU.*\d+.*(fail|error|absent|unplugged)"

  # Fan status issues
  "FAN.*\d+.*(fail|error|absent|speed)"
  ```

  **System and service patterns:**
  ```
  # Container crashes and restarts
  "(docker|container).*(exit|crash|kill|restart)"

  # Service health issues
  "ALL_SERVICE_STATUS.*(fail|error|inactive|stopped)"

  # Memory and resource issues
  "(?i)(oom|out.*memory|killed.*memory)"
  ```

  ## Cross-File Correlation Techniques

  ### Multi-File Analysis Workflow

  **For comprehensive interface analysis:**

  ```
  # 1. Get interface configuration intent
  read_tech_support_file(
      file_path="dump/CONFIG_DB.json",
      pattern="PORT.*Ethernet16.*speed|admin_status",
      page=1
  )

  # 2. Check current operational state
  read_tech_support_file(
      file_path="dump/STATE_DB.json",
      pattern="PORT_TABLE.*Ethernet16.*oper_status",
      page=1
  )

  # 3. Verify interface statistics
  read_tech_support_file(
      file_path="dump/interface.status",
      pattern="Ethernet16",
      page=1
  )

  # 4. Check for recent state changes
  read_tech_support_file(
      file_path="log/swss.rec.gz",
      pattern="Ethernet16.*(state|status|link)",
      page=1
  )
  ```

  ## Best Practices for MCP Tool Usage

  ### 1. Always Start with Extraction
  - Use `extract_tech_support_file` first to get the complete file listing
  - Review the returned file list to understand archive structure
  - Use file sizes to prioritize analysis (larger files may need chunking)

  ### 2. Use Targeted Pattern Matching
  - Start with specific patterns rather than reading entire files
  - Use regex patterns to find relevant content quickly
  - Combine multiple patterns with alternation (`pattern1|pattern2`)

  ### 3. Leverage Automatic Compression Handling
  - MCP tools automatically handle .gz files
  - No need for manual decompression commands
  - Compressed log analysis is seamless

  ### 4. Utilize Pagination for Large Files
  - Start with `page=1` and check `total_pages` in response
  - Use pagination to navigate through large database files
  - Pattern matching reduces the need for full file reads

  ### 5. Cross-Reference Findings
  - Correlate configuration (CONFIG_DB) with operational state (STATE_DB)
  - Match log events with configuration changes
  - Verify hardware status across multiple data sources

  ## File Priority Guide

  ### Critical Files for Initial Assessment
  1. **`dump/version`** - Platform and SONiC version information
  2. **`dump/interface.status`** - Interface operational overview
  3. **`dump/docker.ps`** - Container health status
  4. **`dump/CONFIG_DB.json`** - System configuration (use patterns)
  5. **`dump/STATE_DB.json`** - Operational state (use patterns)

  ### Important Log Files
  1. **`log/swss.rec.gz`** - Network state changes (most critical)
  2. **`log/sairedis.rec.gz`** - Hardware API calls
  3. **`log/syslog.gz`** - System events and errors
  4. **`log/bgpd.log.gz`** - BGP routing events
  5. **Service-specific logs** - Target based on scenario

  ### Hardware and Performance Files
  1. **`dump/sensors`** - Hardware sensor readings
  2. **`dump/top`** - Process resource usage snapshot
  3. **`dump/free`** - Memory utilization
  4. **`dump/docker.stats`** - Container resource usage

  ## Error Handling and Troubleshooting

  ### Tool Response Handling
  - Always check the `success` field in tool responses
  - Review `error_message` if `success` is `false`
  - Use `matches` array to see regex pattern results
  - Check `total_pages` for pagination requirements

  ### Common Issues and Solutions
  - **Pattern not matching**: Verify regex syntax and test with simpler patterns
  - **File not found**: Use `list_tech_support_files_tool` to verify file paths
  - **Large file handling**: Use pagination or more specific patterns
  - **Extraction failure**: Check archive format and file permissions

  ## Summary

  The MCP server tools provide powerful capabilities for SONiC tech support analysis:

  - **Automated extraction** eliminates manual archive handling
  - **Pattern matching** replaces complex grep operations
  - **Intelligent chunking** handles large files safely
  - **Compressed file support** works seamlessly with .gz logs
  - **Structured responses** provide better data for LLM analysis

  Focus on using these tools in combination to build comprehensive analysis workflows that correlate findings across multiple files and data sources.
