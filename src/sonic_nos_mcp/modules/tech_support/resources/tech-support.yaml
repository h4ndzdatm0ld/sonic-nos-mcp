  8. Log File Patterns & Rotation

  A. Log Rotation Patterns:

  # Common rotation patterns observed
  service.log.gz          # Current log
  service.log.1.gz        # Previous rotation
  service.log.N.gz        # Older rotations

  # Examples
  audit.log.gz + audit.log.1.gz
  swss.rec.gz + swss.rec.1.gz
  telemetry.log.gz + telemetry.log.1.gz through telemetry.log.68.gz

  B. Time-based Log Analysis:

  # Telemetry logs are time-sequenced
  telemetry.log.68.gz     # Oldest available
  telemetry.log.1.gz      # Most recent rotation
  telemetry.log.gz        # Current active log

  # Analysis approach
  for i in {1..10}; do
    echo "=== telemetry.log.$i.gz ==="
    gunzip -c telemetry.log.$i.gz | head -5
  done




  9. File Investigation Workflow

  Step 1: Understand the Scope

  # Get overall structure
  ls -la                                    # Top-level overview
  find . -type d | wc -l                    # Total directories
  find . -type f | wc -l                    # Total files
  du -sh */                                 # Size by directory

  # Identify key files
  ls -la dump/ | head -20                   # Core dump files
  ls -la log/ | head -10                    # Log files
  du -sh dump/*.json | sort -hr             # Database files by size



  Step 2: Examine Database Files

  # Start with configuration
  head -50 dump/CONFIG_DB.json | jq '.'     # Configuration structure
  grep -E "VLAN|PORT|MSTP" dump/CONFIG_DB.json | head -20

  # Check operational state
  head -100 dump/STATE_DB.json | jq '.'     # Operational state
  head -50 dump/ASIC_DB.json | jq '.'       # Hardware state (careful - large!)



  Step 3: Analyze System State

  # Interface and network state
  cat dump/interface.status | column -t     # Interface status table
  cat dump/bridge.fdb | head -20            # MAC learning evidence
  cat dump/version                          # SONiC version information

  # System resources
  cat dump/top | head -20                   # Process information
  cat dump/free                            # Memory usage
  cat proc/loadavg                         # Load average



  Step 4: Timeline Analysis

  # Check critical logs (largest first)
  ls -la log/*.gz | sort -k5 -nr | head -10

  # Examine most critical logs
  gunzip -c log/swss.rec.gz | head -20      # SWSS state changes
  gunzip -c log/sairedis.rec.gz | head -20  # SAI API calls
  gunzip -c log/syslog.gz | head -20        # System messages (if available)



