content: |
  # SONiC Tech Support File Analysis Guide

  ## Overview

  SONiC Tech Support File Structure & Analysis Guide

  Overview

  Complete educational guide to understanding SONiC tech support files, their structure, contents, and analysis methods for network troubleshooting. This guide explains what SONiC diagnostic bundles contain, how they are organized, and where to find specific information when investigating platform issues.

  What is a SONiC Tech Support File

  SONiC tech support files are comprehensive diagnostic bundles that capture the complete state of a SONiC network device at a specific point in time. These files contain:

  * System configuration from all databases
  * Operational state and health information
  * Hardware sensor readings and status data
  * Log files from all containers and services
  * Network state including routing and switching tables
  * Process and system resource utilization

  When Tech Support Files are Generated

  There are various reasons to collect tech support files. Typically, the below are applicable:

  * During network outages or performance issues
  * Before and after maintenance activities
  * As part of routine health monitoring
  * When requested by support teams for analysis

  File Naming Convention

  sonic_dump_<hostname>_<timestamp>/

  Example: sonic_dump_arl7-ar-acc-sw-7-4013_20250812_182453/

  Collection Process

  The generate_dump script is a built-in SONiC utility that creates comprehensive diagnostic bundles. This script is typically located at /usr/local/bin/generate_dump on SONiC devices and can be executed via the show techsupport command (recommended) or directly.

  The generate_dump script automatically collects data from:

  * Redis databases containing system state
  * Container logs from all SONiC services
  * Hardware monitoring systems
  * Linux kernel interfaces
  * Network command outputs


  1. Top-Level Directory Structure

  sonic_dump_<hostname>_<timestamp>/
  ├── generate_dump           # Script used to create the dump (78KB, executable)
  ├── dump/                  # 156 files - System state snapshots & command outputs
  ├── log/                   # 107 files - Compressed log files (.gz format)
  ├── etc/                   # 159 files - System configuration files
  ├── proc/                  # 34 files - Linux proc filesystem dump
  ├── proc_stats/            # 3 files - Process statistics
  └── warmboot/              # 3 files - Warm boot related information

  Directory Contents

  Content size was evaluated against multiple tech support outputs

  * dump/ - 156 files - System state snapshots & command outputs
  * log/ - 107 files - Compressed log files (.gz format)
  * etc/ - 159 directories/files - System configuration data
  * proc/ - 34 files - Linux kernel/system information
  * proc_stats/ - 3 files - Process statistics
  * warmboot/ - 3 files - Warm boot related information


  2. SONiC Database Files - Core System Information

  SONiC uses Redis databases to store different types of system information. These databases are exported as JSON files in tech support bundles and contain the most critical information for troubleshooting.

  A. CONFIG_DB.json - System Configuration

  Content: System configuration tables

  Key Tables and Information:


  * DEVICE_METADATA|localhost: Hostname, platform type, MAC address, hardware SKU
  * PORT|EthernetX: Interface configurations including speed, FEC, MTU, admin status
  * VLAN|VlanX: VLAN definitions and VLAN IDs
  * VLAN_MEMBER|VlanX|EthernetY: VLAN membership and tagging mode
  * BREAKOUT_CFG|EthernetX: Port breakout configurations (1x1G, 1x25G, etc.)
  * FEATURE|service_name: Service enable/disable states for all SONiC features
  * STP|GLOBAL, MSTP_INSTANCE: Spanning Tree Protocol configurations
  * POE_PORT|EthernetX: Power over Ethernet port configurations
  * USER_NAME|username: Local user account configurations
  * STATIC_ROUTE: Static routing table entries
  * NTP_SERVER: NTP server configurations

  B. STATE_DB.json - Operational State and Health

  Content: Current operational state and system health information

  Key Tables and Information:


  * SYSTEM_HEALTH_INFO: Overall system health summary with component status
  * PORT_TABLE|EthernetX: Interface operational states, speeds, link status
  * FDB_TABLE|VlanX:MAC: MAC address learning table with port associations
  * PSU_INFO|PSU X: Power supply operational status and health
  * FAN_INFO|FAN-X: Fan operational status, speeds, and health indicators
  * TEMPERATURE_INFO|sensor_name: Temperature readings from all monitored sensors
  * DOCKER_STATS|container_id: Container resource utilization (CPU, memory)
  * PROCESS_STATS|pid: Process CPU and memory usage at collection time
  * ALL_SERVICE_STATUS|service: Health status of all SONiC services
  * TRANSCEIVER_STATUS|EthernetX: Optical transceiver status and errors
  * VLAN_TABLE|VlanX: VLAN operational state
  * ROUTE_TABLE: Routing table operational status

  C. ASIC_DB.json - Hardware Abstraction Layer

  Content: SAI (Switch Abstraction Interface) objects and hardware state

  Contains:

  * SAI object definitions and their current states
  * Port configurations at the hardware level
  * VLAN mappings programmed into hardware
  * Routing table entries in the ASIC
  * Hardware counters and low-level statistics
  * Bridge and switching table entries in hardware

  Safe Analysis Approach:

  # Use targeted searches only
  grep "SAI_PORT" ASIC_DB.json | head -20
  grep "SAI_STP_PORT_STATE" ASIC_DB.json | head -10

  D. COUNTERS_DB.json Files - Interface Statistics

  Content: Interface and system counters

  File Variants:

  * COUNTERS_DB.json: Current counter snapshot
  * COUNTERS_DB_1.json: Previous snapshot for comparison
  * COUNTERS_DB_2.json: Additional time-based snapshot

  Contains:

  * Interface packet and byte counters
  * Error counters (drops, discards, errors)
  * Queue utilization statistics
  * Buffer usage statistics
  * Hardware-specific performance counters

  # Search for specific interface counters
  grep "Ethernet16" COUNTERS_DB.json | head -5

  # Look for error conditions
  grep -E "(error|drop|discard)" COUNTERS_DB.json | head -10

  E. FLEX_COUNTER_DB.json - Counter Configurations

  Content: Flexible counter system configurations

  Contains:

  * Counter polling intervals for different counter types
  * Enabled/disabled counter categories (PORT, QUEUE, BUFFER, etc.)
  * Counter collection policies and settings

  F. APPL_DB.json - Application Layer State

  Content: Application layer database information

  Contains:

  * Route table entries from routing protocols
  * Neighbor table entries (ARP/ND)
  * Application-specific configurations and state
  * Port channel and LAG information

  4. System Information and Network State Files

  A. Network State Files

  interface.status

  Content: Formatted table of all interface operational states

  Information provided:

  * Interface names and physical lane assignments
  * Current speed and MTU configuration
  * FEC (Forward Error Correction) status
  * Administrative status (up/down/disabled)
  * Operational status (up/down)
  * VLAN assignment (trunk/routed/access)
  * Interface type (RJ45, SFP, QSFP, etc.)

  bridge.fdb

  Content: Kernel bridge forwarding database (MAC address table)

  Information provided:

  * Learned MAC addresses from network traffic
  * VLAN associations for each MAC address
  * Port where each MAC was learned
  * Entry type (dynamic learning vs static configuration)

  bridge.vlan

  Content: VLAN membership information from kernel bridge perspective

  vlan.summary

  Content: Summary of VLAN configuration and membership

  B. Hardware Information Files

  sensors

  Content: Current temperature sensor readings from all monitored components
  Use for: Thermal monitoring and overheating troubleshooting

  fan

  Content: Fan operational status including speed and health indicators
  Use for: Cooling system monitoring and failure detection

  temperature

  Content: Detailed temperature readings from all thermal sensors
  Use for: Thermal analysis and cooling system effectiveness

  syseeprom

  Content: System EEPROM information including serial numbers, part numbers, and manufacturing data
  Use for: Hardware identification and inventory management

  C. System Resource and Process Files

  top

  Content: Process list with CPU and memory usage snapshot at collection time
  Use for: Performance analysis and resource utilization troubleshooting

  ps.aux / ps.extended

  Content: Complete process listings with detailed resource information
  Use for: Process analysis and service troubleshooting

  free

  Content: System memory usage statistics
  Use for: Memory utilization analysis

  vmstat, vmstat.m, vmstat.s

  Content: Virtual memory and system performance statistics
  Use for: System performance analysis and bottleneck identification

  D. Service and Container Information

  services.summary

  Content: Systemd service states and health status
  Use for: Service health monitoring and failure detection

  docker.ps

  Content: Docker container status and basic information
  Use for: Container health and operational state verification

  docker.stats

  Content: Container resource utilization (CPU, memory, I/O)
  Use for: Container performance analysis

  version

  Content: SONiC version information and build details
  Use for: Version verification and compatibility analysis


  E. Hardware and Low-Level Information

  saidump

  Content: Complete SAI (Switch Abstraction Interface) object dump
  Use for: Low-level hardware state analysis and ASIC troubleshooting


  platform.summary

  Content: Platform-specific hardware information and capabilities
  Use for: Hardware platform identification and feature verification


  lspci / lsusb

  Content: PCI and USB device information
  Use for: Hardware component identification


  hdparm / ssdhealth

  Content: Storage device health and performance information
  Use for: Storage system troubleshooting


  3. Log Files - Event Timeline and Service Information

  All log files in the /log directory are compressed (.gz format) and contain timestamped events from SONiC services and system components.


  A. Critical Log Files for Network Troubleshooting

  sairedis.rec.gz - Hardware API Calls

  Priority: CRITICAL for hardware-related issues
  Content: SAI (Switch Abstraction Interface) API calls with microsecond timing

  What it contains:

  * Low-level hardware API calls to the ASIC
  * Port state change commands sent to hardware
  * Hardware programming sequences and timing
  * ASIC configuration updates and responses

  Use for troubleshooting:

  * Hardware-level port issues
  * ASIC programming failures
  * Low-level switching problems
  * Hardware abstraction layer debugging

  Analysis commands:

  # View recent hardware API calls
  gunzip sairedis.rec.gz | tail -20

  # Search for port-related hardware calls
  gunzip sairedis.rec.gz | grep -E "(PORT|STP)" | head -10

  swss.rec.gz - Switch State Service Changes

  Priority: CRITICAL for network state issues
  Content: Database state changes from Switch State Service

  What it contains:

  * Interface state transitions (up/down)
  * VLAN membership changes
  * Spanning Tree Protocol state changes
  * MAC address learning and aging events
  * Route table updates
  * Network configuration changes

  Use for troubleshooting:

  * Interface connectivity problems
  * VLAN configuration issues
  * Spanning tree convergence problems
  * MAC learning failures
  * Network state inconsistencies

  Analysis commands:

  # View recent state changes
  gunzip swss.rec.gz | tail -30

  # Search for specific interface events
  gunzip swss.rec.gz | grep "Ethernet16" | head -10

  # Find spanning tree events
  gunzip swss.rec.gz | grep -E "(STP|BLOCK|LEARN|FORWARD)" | head -10

  syslog.gz - System-Wide Events

  Priority: HIGH for overall system events
  Content: System-wide log messages from all services and components

  What it contains:

  * System startup and shutdown events
  * Service start, stop, and restart events
  * Hardware alerts and warnings
  * Critical error messages
  * Network connectivity events
  * Authentication and authorization events

  Use for troubleshooting:

  * System stability issues
  * Service failures and restarts
  * Hardware alerts and failures
  * Timeline reconstruction for incidents
  * Correlation of events across services

  Analysis commands:


  # View recent system events
  gunzip syslog.gz | tail -50

  # Search for errors and critical events
  gunzip syslog.gz | grep -E "(ERROR|CRITICAL|FAIL)" | head -20

  # Time-specific analysis
  gunzip syslog.gz | grep "2025-08-12 18:2[0-5]" | head -30

  B. Service-Specific Log Files

  BGP and Routing Service Logs

  * bgpd.log.gz: BGP daemon events and neighbor state changes
  * zebra.log.gz: Zebra routing daemon logs and route updates

  System Service Logs

  * auth.log.gz: User authentication events and SSH connections
  * audit.log.gz: System security audit events
  * cron.log.gz: Scheduled task execution and results
  * gnmi.log.gz: gNMI telemetry service events

  C. Telemetry and Monitoring Logs

  Telemetry Log Pattern

  Files: telemetry.log.gz, telemetry.log.1.gz through telemetry.log.68.gz
  Content: Network device telemetry streams and monitoring data

  System Activity Reports

  Files: sar03.gz through sar12.gz (hourly), sa04.gz through sa12.gz (daily)
  Content: System performance statistics including CPU, memory, I/O, and network utilization over time

  B. Telemetry Logs

  # Numbered telemetry logs (telemetry.log.1.gz through telemetry.log.68.gz)
  telemetry.log.gz     # Current telemetry
  telemetry.log.1.gz   # Previous rotation
  telemetry.log.N.gz   # Historical telemetry data

  C. System Activity Reports (sar files)

  # System Activity Reporter logs
  sar03.gz through sar12.gz  # Hourly system statistics
  sa04.gz through sa12.gz    # Daily system activity

  # File pattern
  sa##.gz     # System activity for specific hours
  sar##.gz    # System activity reports

  D. Misc Logs

  btmp.gz             # Failed login attempts
  wtmp.gz             # Login/logout records
  user.log.gz         # User-related messages
  dpkg.log.gz         # Package management


