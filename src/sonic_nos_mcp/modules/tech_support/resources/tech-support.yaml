  11. Investigation Command Patterns

  A. File Discovery Commands:

  # Understand the tech support structure
  find . -name "*.json" | head -20                    # All JSON databases
  find . -name "*.gz" | wc -l                         # Total compressed logs
  find . -type f -size +1M | head -10                 # Large files requiring care
  find . -name "*interface*" -o -name "*bridge*"      # Network-related files
  find . -name "*bgp*" -o -name "*route*"             # Routing files



  B. Size-Aware Analysis:

  # Check file sizes before analysis
  ls -lah dump/ | sort -k5 -hr | head -15             # Dump files by size
  ls -lah log/ | sort -k5 -hr | head -15              # Log files by size
  du -sh */ | sort -hr                                # Directory sizes

  # Safe file analysis
  wc -l dump/CONFIG_DB.json                           # Line count check
  head -100 dump/ASIC_DB.json | grep "pattern"        # Limited head analysis



  C. Cross-Directory Correlation:

  # Compare information across directories
  echo "Interface from CONFIG:"; grep "Ethernet16" dump/CONFIG_DB.json | head -3
  echo "Interface from STATE:"; grep "Ethernet16" dump/STATE_DB.json | head -3
  echo "Interface from proc:"; grep -r "Ethernet16" proc/ 2>/dev/null | head -3




  12. Common File Access Patterns

  A. JSON File Analysis:

  # Large JSON files (>500KB)
  grep "specific_key" ASIC_DB.json | head -20         # Pattern search first
  head -1000 ASIC_DB.json | grep "pattern"           # Limited head + search
  jq 'keys' CONFIG_DB.json | head -20                # Structure analysis

  # Medium JSON files (100KB-500KB)
  jq '.' CONFIG_DB.json | head -100                  # Full structure review
  cat STATE_DB.json | jq '.PORT_TABLE' | head -50   # Specific table analysis



  B. Compressed Log Analysis:

  # Always check file size first
  ls -lah log/swss.rec.gz                            # Check compressed size
  gunzip -l log/swss.rec.gz                          # Check uncompressed size

  # Time-based analysis
  gunzip -c log/swss.rec.gz | grep "2025-08-12" | head -20
  gunzip log/syslog.gz | tail -100 | head -50          # Recent events

  # Pattern search in compressed files
  gunzip -c log/sairedis.rec.gz | grep -E "(DOWN|BLOCK)" | head -10



  C. Directory Traversal:

  # Systematic directory exploration
  for dir in dump log etc proc; do
    echo "=== $dir directory ==="
    ls -la $dir | wc -l
    ls -la $dir | head -5
    echo
  done

  # Find specific file types
  find . -name "*.json" -exec du -sh {} \; | sort -hr | head -10
  find . -name "*.gz" -exec ls -lah {} \; | sort -k5 -hr | head -10




  13. Pro Tips for Structure Analysis

  Always Check First:

  * File sizes before opening large JSON files
  * Compression ratio for log files (gunzip -l filename.gz)
  * Directory structure with tree or find commands
  * File modification times to understand collection timing

  Safe Analysis Approach:

  1. Start with small files (version, interface.status, bridge.fdb)
  2. Use head/tail on medium files for structure understanding
  3. Use targeted grep on large files with specific patterns
  4. Cross-reference findings across multiple file types

  Performance Guidelines:

  * JSON files >500KB: Use grep, avoid full loading
  * Compressed logs >100KB: Use gunzip -c with targeted patterns
  * Always use head -N to limit output initially
  * Build up complexity from simple to complex searches



  14. Troubleshooting Quick Reference

  Problem Type to File Mapping

  Interface Connectivity Issues

  Primary Files:


  * interface.status: Administrative and operational states
  * STATE_DB.json: PORT_TABLE entries for detailed operational information
  * CONFIG_DB.json: PORT and BREAKOUT_CFG tables for intended configuration
  * COUNTERS_DB.json: Interface error counters and statistics

  Analysis Sequence:


  1. Check interface.status for admin/operational state mismatch
  2. Verify intended configuration in CONFIG_DB.json PORT tables
  3. Check operational details in STATE_DB.json PORT_TABLE
  4. Examine error counters in COUNTERS_DB.json for drops/errors
  5. Review recent state changes in log/swss.rec.gz

  MAC Learning Problems

  Primary Files:


  * bridge.fdb: Current kernel MAC learning table
  * STATE_DB.json: FDB_TABLE entries showing learned MACs
  * CONFIG_DB.json: VLAN_MEMBER configurations for port assignments
  * log/swss.rec.gz: MAC learning and aging events

  Analysis Sequence:


  1. Check current MAC address table in bridge.fdb
  2. Verify VLAN membership configuration in CONFIG_DB.json
  3. Review database FDB entries in STATE_DB.json
  4. Examine MAC learning events in log/swss.rec.gz

  Hardware Issues

  Primary Files:


  * STATE_DB.json: SYSTEM_HEALTH_INFO, PSU_INFO, FAN_INFO, TEMPERATURE_INFO tables
  * sensors: Current hardware sensor readings
  * log/syslog.gz: Hardware alerts and error messages
  * log/sairedis.rec.gz: Low-level hardware API calls

  Analysis Sequence:


  1. Check SYSTEM_HEALTH_INFO table in STATE_DB.json for overall status
  2. Review individual hardware component status (PSU, fans, temperature)
  3. Examine current sensor readings in sensors file
  4. Search for hardware-related events in system logs

  Performance Issues

  Primary Files:


  * top: Process CPU and memory usage snapshot
  * STATE_DB.json: DOCKER_STATS and PROCESS_STATS tables
  * free: System memory utilization
  * vmstat, vmstat.m, vmstat.s: System performance statistics

  Analysis Sequence:


  1. Check top output for high CPU/memory consuming processes
  2. Review container resource usage in STATE_DB.json DOCKER_STATS
  3. Examine system memory status in free output
  4. Analyze system performance trends in vmstat files

  Spanning Tree Protocol Issues

  Primary Files:


  * CONFIG_DB.json: STP and MSTP configuration tables
  * STATE_DB.json: STP operational state information
  * log/swss.rec.gz: STP state change events and transitions
  * bridge.vlan, bridge.fdb: Bridge forwarding and VLAN state

  BGP and Routing Issues

  Primary Files:


  * bgp.neighbors: BGP neighbor states and session information
  * bgp.summary: BGP session summary and statistics
  * bgp.table: BGP routing table entries
  * ip.route: System routing table
  * log/bgpd.log.gz, log/zebra.log.gz: Routing daemon logs

  Service Health Issues

  Primary Files:


  * STATE_DB.json: ALL_SERVICE_STATUS table for service health
  * services.summary: Systemd service states
  * docker.ps: Container operational status
  * Service-specific logs in log/ directory (bgpd.log.gz, gnmi.log.gz, etc.)


  15. Essential Analysis Commands

  Quick Structure Overview

  # Get complete tech support overview
  echo "=== DIRECTORY STRUCTURE ==="; ls -la
  echo "=== DUMP FILES (by size) ==="; ls -lah dump/ | sort -k5 -hr | head -10
  echo "=== LOG FILES (by size) ==="; ls -lah log/ | sort -k5 -hr | head -10
  echo "=== TOTAL FILES ==="; find . -type f | wc -l

  File Type Analysis

  # Categorize all files
  echo "JSON databases:"; find . -name "*.json" | wc -l
  echo "Compressed logs:"; find . -name "*.gz" | wc -l
  echo "Text files:"; find . -type f ! -name "*.json" ! -name "*.gz" | wc -l
  echo "Directories:"; find . -type d | wc -l



  Size-Based Analysis

  # Understand what needs careful handling
  echo "=== FILES >1MB ==="; find . -type f -size +1M -exec ls -lah {} \;
  echo "=== FILES 100KB-1MB ==="; find . -type f -size +100k -size -1M | head -10
  echo "=== SMALL FILES <10KB ==="; find . -type f -size -10k | head -20



  Cross-File Correlation Examples

  # Interface analysis across multiple sources
  INTERFACE="Ethernet16"  # Replace with target interface
  echo "CONFIG:"; grep "$INTERFACE" dump/CONFIG_DB.json | head -3
  echo "STATE:"; grep "$INTERFACE" dump/STATE_DB.json | head -3
  echo "STATUS:"; grep "$INTERFACE" dump/interface.status
  echo "FDB:"; grep "$INTERFACE" dump/bridge.fdb 2>/dev/null || echo "No FDB entries"

  # Hardware status correlation
  echo "HEALTH:"; grep "SYSTEM_HEALTH" dump/STATE_DB.json
  echo "SENSORS:"; cat dump/sensors | head -10
  echo "HARDWARE LOGS:"; gunzip log/syslog.gz | grep -i "hardware\|psu\|fan" | head -5




  16. SONiC Container Architecture Context

  Container Structure

  SONiC operates as a containerized system with specialized containers for different network functions:

  Core Containers:


  * database: Redis databases (CONFIG_DB, STATE_DB, etc.)
  * swss: Switch State Service - core switching logic
  * syncd: Synchronization daemon - hardware abstraction
  * bgp: Border Gateway Protocol routing
  * lldp: Link Layer Discovery Protocol
  * snmp: Simple Network Management Protocol
  * teamd: Link Aggregation Control Protocol (LACP)
  * pmon: Platform monitoring (hardware sensors)
  * gnmi: gNMI telemetry service

  Container Information in Tech Support Files

  Container-specific information can be found in:


  * /dump/container_dumps/: Per-container diagnostic data
  * docker.ps, docker.stats: Container status and resource usage
  * Individual container logs in /log/ directory
  * Container process information in STATE_DB.json DOCKER_STATS table
