name: Dependencies

on:
  schedule:
    # Run weekly on Mondays at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update dependencies
        run: |
          # Update all dependencies to latest versions
          uv sync --upgrade
          
          # Check if there are any changes
          if git diff --quiet uv.lock; then
            echo "No dependency updates available"
            echo "HAS_UPDATES=false" >> $GITHUB_ENV
          else
            echo "Dependencies updated"
            echo "HAS_UPDATES=true" >> $GITHUB_ENV
          fi

      - name: Run tests with updated dependencies
        if: env.HAS_UPDATES == 'true'
        run: |
          uv run pytest --cov=sonic_nos_mcp --cov-fail-under=90

      - name: Run security checks
        if: env.HAS_UPDATES == 'true'
        run: |
          uv add safety bandit[toml]
          uv run safety check --json --output safety-report.json || true
          uv run bandit -r src/ -f json -o bandit-report.json || true

      - name: Create Pull Request
        if: env.HAS_UPDATES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: update dependencies'
          body: |
            ## Dependency Updates
            
            This PR updates project dependencies to their latest versions.
            
            ### Changes
            - Updated `uv.lock` with latest dependency versions
            - All tests pass with updated dependencies
            - Security scans completed
            
            ### Validation
            - ✅ Tests pass
            - ✅ Type checking passes  
            - ✅ Security scans completed
            
            Please review the changes and merge if everything looks good.
            
            ---
            *This PR was automatically created by the dependency update workflow*
          branch: dependencies/auto-update
          delete-branch: true

  security-audit:
    name: Security Audit  
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run comprehensive security audit
        run: |
          # Install security tools
          uv add safety bandit[toml] pip-audit
          
          # Run safety check for known vulnerabilities
          echo "🔍 Running safety check..."
          uv run safety check --json --output safety-report.json || true
          
          # Run bandit for security issues in code
          echo "🔍 Running bandit security scan..."
          uv run bandit -r src/ -f json -o bandit-report.json || true
          
          # Run pip-audit for additional vulnerability checking
          echo "🔍 Running pip-audit..."
          uv run pip-audit --format=json --output=pip-audit-report.json || true
          
          echo "✅ Security audit completed"

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: |
            safety-report.json
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          # Parse safety report for critical vulnerabilities
          if [ -f safety-report.json ]; then
            echo "📊 Safety scan results:"
            cat safety-report.json | jq -r '.vulnerabilities[] | "- \(.vulnerability_id): \(.vulnerability.title)"' || true
          fi
          
          # Parse bandit report for high severity issues  
          if [ -f bandit-report.json ]; then
            echo "📊 Bandit scan results:"
            cat bandit-report.json | jq -r '.results[] | select(.issue_severity == "HIGH" or .issue_severity == "CRITICAL") | "- \(.test_name): \(.issue_text)"' || true
          fi
