# Basic SONiC Analysis Test Cases
# Tests fundamental SONiC tech support file analysis capabilities

test_cases:
  - id: "sonic-basic-001"
    category: "system_health"
    tech_support_file: "test/data/techsupport/techsupport_bgp_md5.tar.gz"
    query: |
      Extract the SONiC tech support file and provide a comprehensive system health summary including:
      1. SONiC version, OS, kernel version, and platform information
      2. System uptime and boot status
      3. Docker container status - which containers are running and their uptime
      4. I am not interested in any other information other than the above.
    expected: |
      Complete system health report with SONiC version, container status, uptime information,
      and overall health assessment based on container states and system stability.
    expected_tools: ["extract_tech_support_file", "read_tech_support_file"]
    expected_patterns: ["SONiC version", "container status", "uptime", "health assessment"]
    context:
      analysis_type: "targeted_system_health"
      focus_areas: ["version_info", "container_health", "system_uptime"]
      key_files: ["dump/version", "dump/docker.ps", "dump/uptime"]

